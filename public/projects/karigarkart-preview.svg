<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140c24"/>
      <stop offset="100%" stop-color="#05030a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Top App Window Bar -->
  <rect width="800" height="38" fill="#1e1136"/>
  <circle cx="20" cy="19" r="6" fill="#ef4444"/>
  <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="19" r="6" fill="#10b981"/>
  <text x="400" y="24" fill="#d8b4fe" font-family="monospace" font-size="12" text-anchor="middle">KarigarKart • Artisan Storefront &amp; Sales Dashboard</text>

  <!-- Left Sidebar Navigation Mockup -->
  <rect x="0" y="38" width="180" height="442" fill="#0b0616"/>
  <rect x="15" y="60" width="150" height="30" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
  <text x="30" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">📊 Dashboard</text>
  <text x="30" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">🏺 Inventory</text>
  <text x="30" y="155" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">📦 Orders (28)</text>
  <text x="30" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">📈 Analytics</text>
  <text x="30" y="225" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">⚙️ API Tokens</text>

  <!-- Top Metric Cards -->
  <g transform="translate(200, 55)">
    <rect x="0" y="0" width="180" height="75" rx="8" fill="#160e2b" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="15" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11">TOTAL REVENUE</text>
    <text x="15" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">₹84,250</text>

    <rect x="195" y="0" width="180" height="75" rx="8" fill="#160e2b" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="210" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">ACTIVE ARTISANS</text>
    <text x="210" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">142 Karigars</text>

    <rect x="390" y="0" width="180" height="75" rx="8" fill="#160e2b" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="405" y="24" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11">FULFILLMENT RATE</text>
    <text x="405" y="52" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">98.4%</text>
  </g>

  <!-- Recent Artisan Products Grid Mockup -->
  <g transform="translate(200, 150)">
    <rect x="0" y="0" width="570" height="290" rx="10" fill="#120a22" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="20" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">LIVE ARTISAN CATALOG • FASTAPI REST BACKEND</text>

    <!-- Product Row 1 -->
    <rect x="20" y="50" width="530" height="50" rx="6" fill="#1c1033"/>
    <circle cx="45" cy="75" r="14" fill="#f59e0b"/>
    <text x="75" y="72" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Handcrafted Terracotta Vases (Set of 3)</text>
    <text x="75" y="88" fill="#94a3b8" font-family="monospace" font-size="10">Artisan: Rameshwar Pottery • SKU: TER-204</text>
    <text x="480" y="80" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">IN STOCK</text>

    <!-- Product Row 2 -->
    <rect x="20" y="110" width="530" height="50" rx="6" fill="#1c1033"/>
    <circle cx="45" cy="135" r="14" fill="#06b6d4"/>
    <text x="75" y="132" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Pure Chanderi Silk Handloom Stole</text>
    <text x="75" y="148" fill="#94a3b8" font-family="monospace" font-size="10">Artisan: Malwa Weavers Guild • SKU: SILK-881</text>
    <text x="480" y="140" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">IN STOCK</text>

    <!-- Product Row 3 -->
    <rect x="20" y="170" width="530" height="50" rx="6" fill="#1c1033"/>
    <circle cx="45" cy="195" r="14" fill="#a855f7"/>
    <text x="75" y="192" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Brass Inlay Walnut Wood Jewelry Box</text>
    <text x="75" y="208" fill="#94a3b8" font-family="monospace" font-size="10">Artisan: Bhopal Woodcraft Collective • SKU: WOD-412</text>
    <text x="480" y="200" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">LOW STOCK</text>
  </g>
</svg>
