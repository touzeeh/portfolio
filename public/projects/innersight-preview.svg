<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Top App Window Bar -->
  <rect width="800" height="38" fill="#0f172a"/>
  <circle cx="20" cy="19" r="6" fill="#ef4444"/>
  <circle cx="38" cy="19" r="6" fill="#f59e0b"/>
  <circle cx="56" cy="19" r="6" fill="#10b981"/>
  <text x="400" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">InnerSight • 3D Hospital Spatial Wayfinding Engine</text>

  <!-- 3D Isometric Hospital Multi-Floor Grid Preview -->
  <g transform="translate(100, 60)">
    <!-- Floor 3 (Upper Level) -->
    <polygon points="300,40 540,110 300,180 60,110" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="80" y="115" fill="#38bdf8" font-family="monospace" font-size="11">LEVEL 3: SURGICAL</text>

    <!-- Floor 2 (Connecting Level) -->
    <polygon points="300,120 540,190 300,260 60,190" fill="#0f172a" fill-opacity="0.7" stroke="#06b6d4" stroke-width="2"/>
    <text x="80" y="195" fill="#06b6d4" font-family="monospace" font-size="11">LEVEL 2: CARDIOLOGY</text>

    <!-- Navigation Waypoint Line (Dijkstra Path) -->
    <polyline points="180,165 240,185 300,170 380,215 460,200" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    <circle cx="180" cy="165" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <text x="180" y="150" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">START: ELEVATOR B</text>

    <circle cx="460" cy="200" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="460" y="185" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">DEST: ICU ROOM 204</text>

    <!-- Floor 1 (Ground Level) -->
    <polygon points="300,200 540,270 300,340 60,270" fill="#020617" fill-opacity="0.8" stroke="#64748b" stroke-width="1.5"/>
    <text x="80" y="275" fill="#94a3b8" font-family="monospace" font-size="11">LEVEL 1: EMERGENCY</text>
  </g>

  <!-- Side UI HUD Overlay -->
  <g transform="translate(620, 60)">
    <rect width="160" height="180" rx="10" fill="#030712" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="15" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">ROUTE TELEMETRY</text>
    <text x="15" y="50" fill="#94a3b8" font-family="monospace" font-size="10">Distance: 142m</text>
    <text x="15" y="70" fill="#94a3b8" font-family="monospace" font-size="10">Transit: 1.8 min</text>
    <text x="15" y="90" fill="#94a3b8" font-family="monospace" font-size="10">Turn: Elevator 3L</text>
    <text x="15" y="115" fill="#38bdf8" font-family="monospace" font-size="10">Status: OPTIMAL</text>
    <rect x="15" y="130" width="130" height="24" rx="4" fill="#0284c7"/>
    <text x="80" y="146" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">START GUIDANCE</text>
  </g>
</svg>
