<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LRC Tap-to-Sync Calibration Tool</title>
  <style>
    :root {
      --bg: #070A14;
      --surface: #0E1424;
      --surface-2: #141B30;
      --border: rgba(148, 163, 184, 0.2);
      --accent: #22D3EE;
      --accent-glow: rgba(34, 211, 238, 0.35);
      --text: #E8ECF6;
      --text-muted: #8E9BB5;
      --font: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      max-width: 1000px;
      margin: 0 auto 24px auto;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 span { color: var(--accent); }

    .help-pill {
      font-size: 0.75rem;
      background: var(--surface-2);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--mono);
    }
    .help-pill kbd {
      background: var(--surface);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 860px) {
      .container { grid-template-columns: 1fr; }
    }

    /* Player Dock */
    .dock-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: fit-content;
      position: sticky;
      top: 24px;
    }

    .time-display {
      font-family: var(--mono);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent-glow);
      text-align: center;
      letter-spacing: 0.05em;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }

    button {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover {
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    button.primary {
      background: var(--accent);
      color: #070A14;
      border-color: var(--accent);
      font-weight: 700;
    }
    button.primary:hover {
      background: #67e8f9;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    /* Lyrics List */
    .lyrics-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: calc(100vh - 120px);
    }

    .lyrics-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .lyrics-scroll {
      overflow-y: auto;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .lyric-item {
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .lyric-item .text {
      flex: 1;
      color: var(--text-muted);
    }
    .lyric-item .tag {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 12px;
    }

    .lyric-item.passed {
      background: rgba(14, 20, 36, 0.4);
    }
    .lyric-item.passed .text {
      color: rgba(232, 236, 246, 0.65);
    }
    .lyric-item.passed .tag {
      color: #34d399;
    }

    .lyric-item.active {
      background: rgba(34, 211, 238, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.15);
    }
    .lyric-item.active .text {
      color: #ffffff;
      font-weight: 600;
      font-size: 1.05rem;
    }
    .lyric-item.active .tag {
      color: var(--accent);
      font-weight: 700;
    }

    /* Output Section */
    .output-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    textarea {
      width: 100%;
      height: 120px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 8px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Tap-to-Sync</span> Audio Calibration</h1>
    <div class="help-pill">
      <kbd>Space</kbd> Stamp Line &bull; <kbd>Backspace</kbd> Undo &bull; <kbd>&larr;/&rarr;</kbd> Seek &plusmn;2s
    </div>
  </header>

  <div class="container">
    <!-- Left: Lyrics Progression List -->
    <div class="lyrics-panel">
      <div class="lyrics-header">
        <span id="progress-indicator">Lines: 0 / 0</span>
        <button id="btn-restart" style="padding: 4px 10px; font-size: 0.75rem;">Reset All</button>
      </div>
      <div class="lyrics-scroll" id="lyrics-container">
        <!-- Lines dynamically populated -->
      </div>
    </div>

    <!-- Right: Sticky Audio Controls & Output -->
    <div class="dock-panel">
      <div class="time-display" id="time-readout">00:00.00</div>

      <div class="slider-row">
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1">
      </div>

      <div class="controls-row">
        <button id="btn-seek-back">&laquo; -2s</button>
        <button id="btn-play" class="primary">&#9654; Play</button>
        <button id="btn-seek-fwd">+2s &raquo;</button>
        <button id="btn-rate">Rate: 1.0x</button>
      </div>

      <div style="font-size: 0.8rem; color: var(--text-muted); text-align: center; margin-top: 4px;">
        Press <strong style="color:var(--accent);">Space</strong> right when the highlighted line starts!
      </div>

      <div class="output-section">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="font-size: 0.8rem;">Export lyrics.lrc</strong>
          <div style="display:flex; gap:6px;">
            <button id="btn-copy" style="font-size:0.75rem; padding: 4px 8px;">Copy</button>
            <button id="btn-download" style="font-size:0.75rem; padding: 4px 8px;" class="primary">Download</button>
          </div>
        </div>
        <textarea id="lrc-output" placeholder="Generated LRC output will appear here..." readonly></textarea>
      </div>
    </div>
  </div>

  <audio id="audio" src="/assets/audio/song.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const timeReadout = document.getElementById('time-readout');
    const seekBar = document.getElementById('seek-bar');
    const btnPlay = document.getElementById('btn-play');
    const btnRate = document.getElementById('btn-rate');
    const btnSeekBack = document.getElementById('btn-seek-back');
    const btnSeekFwd = document.getElementById('btn-seek-fwd');
    const btnRestart = document.getElementById('btn-restart');
    const btnCopy = document.getElementById('btn-copy');
    const btnDownload = document.getElementById('btn-download');
    const lyricsContainer = document.getElementById('lyrics-container');
    const lrcOutput = document.getElementById('lrc-output');
    const progressIndicator = document.getElementById('progress-indicator');

    let lines = [];
    let timestamps = []; // Array of { time: number | null, text: string }
    let currentIndex = 0;
    let playbackRates = [1.0, 0.75];
    let rateIdx = 0;

    function formatTime(sec) {
      if (!isFinite(sec) || sec < 0) sec = 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const cs = Math.floor((sec % 1) * 100);
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
    }

    // Load lyrics.txt
    async function init() {
      try {
        const res = await fetch('/assets/audio/lyrics.txt');
        if (!res.ok) throw new Error('Could not load /assets/audio/lyrics.txt');
        const text = await res.text();
        lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      } catch (e) {
        console.warn('Falling back to default lyrics set:', e);
        lines = [
          "Will you hold the line",
          "When every one of them has given up and given in? Tell me",
          "In this house of mine",
          "Nothing ever comes without a consequence or cost, tell me",
          "Will the stars align?",
          "Will heaven step in? Will it save us from our sin, will it?",
          "'Cause this house of mine stands strong",
          "That's the price you pay",
          "Leave behind your heart and cast away",
          "Just another product of today",
          "Rather be the hunter than the prey",
          "And you're standing on the edge, face up",
          "'Cause you're a natural",
          "A beating heart of stone",
          "You gotta be so cold",
          "To make it in this world",
          "Yeah, you're a natural",
          "Living your life cutthroat",
          "You gotta be so cold",
          "Yeah, you're a natural"
        ];
      }

      timestamps = lines.map(text => ({ time: null, text }));
      renderLines();
    }

    function renderLines() {
      lyricsContainer.innerHTML = '';
      progressIndicator.innerText = `Lines: ${currentIndex} / ${lines.length}`;

      timestamps.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'lyric-item';
        if (idx === currentIndex) el.classList.add('active');
        else if (item.time !== null) el.classList.add('passed');

        const textEl = document.createElement('span');
        textEl.className = 'text';
        textEl.innerText = `${idx + 1}. ${item.text}`;

        const tagEl = document.createElement('span');
        tagEl.className = 'tag';
        tagEl.innerText = item.time !== null ? `[${formatTime(item.time)}]` : (idx === currentIndex ? 'NEXT ▶' : '--:--');

        el.appendChild(textEl);
        el.appendChild(tagEl);

        el.onclick = () => {
          currentIndex = idx;
          renderLines();
          scrollActiveIntoView();
        };

        lyricsContainer.appendChild(el);
      });

      scrollActiveIntoView();
      updateLrcOutput();
    }

    function scrollActiveIntoView() {
      const activeEl = lyricsContainer.querySelector('.active');
      if (activeEl) {
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function updateLrcOutput() {
      const stamped = timestamps.filter(t => t.time !== null);
      if (stamped.length === 0) {
        lrcOutput.value = '';
        return;
      }
      const lrcLines = [
        '[ti:Natural]',
        '[ar:Imagine Dragons]',
        '[offset:0]',
        ...stamped.map(t => `[${formatTime(t.time)}] ${t.text}`)
      ];
      lrcOutput.value = lrcLines.join('\n');
    }

    // Audio Loop
    function tick() {
      if (audio) {
        timeReadout.innerText = formatTime(audio.currentTime);
        if (audio.duration) {
          seekBar.value = (audio.currentTime / audio.duration) * 100;
        }
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // Audio Event Handlers
    btnPlay.onclick = () => {
      if (audio.paused) {
        audio.play().then(() => {
          btnPlay.innerHTML = '&#10074;&#10074; Pause';
        }).catch(console.error);
      } else {
        audio.pause();
        btnPlay.innerHTML = '&#9654; Play';
      }
    };

    btnRate.onclick = () => {
      rateIdx = (rateIdx + 1) % playbackRates.length;
      audio.playbackRate = playbackRates[rateIdx];
      btnRate.innerText = `Rate: ${playbackRates[rateIdx]}x`;
    };

    btnSeekBack.onclick = () => {
      audio.currentTime = Math.max(0, audio.currentTime - 2);
    };

    btnSeekFwd.onclick = () => {
      audio.currentTime = Math.min(audio.duration || 999, audio.currentTime + 2);
    };

    seekBar.oninput = () => {
      if (audio.duration) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    };

    btnRestart.onclick = () => {
      if (confirm('Reset all recorded timestamps?')) {
        timestamps.forEach(t => t.time = null);
        currentIndex = 0;
        renderLines();
      }
    };

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // Ignore if typing in textarea
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        // If not playing, start playing
        if (audio.paused) {
          audio.play();
          btnPlay.innerHTML = '&#10074;&#10074; Pause';
        }
        // Stamp current line
        if (currentIndex < timestamps.length) {
          timestamps[currentIndex].time = audio.currentTime;
          currentIndex++;
          renderLines();
        }
      } else if (e.code === 'Backspace') {
        e.preventDefault();
        if (currentIndex > 0) {
          currentIndex--;
          timestamps[currentIndex].time = null;
          renderLines();
        }
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        audio.currentTime = Math.max(0, audio.currentTime - 2);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        audio.currentTime = Math.min(audio.duration || 999, audio.currentTime + 2);
      }
    });

    btnCopy.onclick = () => {
      navigator.clipboard.writeText(lrcOutput.value);
      btnCopy.innerText = 'Copied!';
      setTimeout(() => btnCopy.innerText = 'Copy', 1500);
    };

    btnDownload.onclick = () => {
      const blob = new Blob([lrcOutput.value], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lyrics.lrc';
      a.click();
    };

    init();
  </script>
</body>
</html>
