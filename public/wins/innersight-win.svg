<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Outer Boundary Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Viewfinder Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#06b6d4" stroke-width="4" fill="none"/>
  <path d="M 750 20 L 780 20 L 780 50" stroke="#06b6d4" stroke-width="4" fill="none"/>
  <path d="M 780 450 L 780 480 L 750 480" stroke="#06b6d4" stroke-width="4" fill="none"/>
  <path d="M 50 480 L 20 480 L 20 450" stroke="#06b6d4" stroke-width="4" fill="none"/>

  <!-- Radial Glow Behind Trophy -->
  <circle cx="400" cy="190" r="130" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>
  <circle cx="400" cy="190" r="80" fill="#eab308" opacity="0.12" filter="url(#glow)"/>

  <!-- Trophy Illustration -->
  <g transform="translate(340, 100) scale(1.2)">
    <!-- Trophy Cup -->
    <path d="M 20 20 L 80 20 C 80 60 70 80 50 85 C 30 80 20 60 20 20 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="2"/>
    <!-- Trophy Handles -->
    <path d="M 20 30 C 5 30 5 55 22 60" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 80 30 C 95 30 95 55 78 60" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <!-- Trophy Stem & Base -->
    <path d="M 45 85 L 55 85 L 55 105 L 45 105 Z" fill="url(#goldGrad)"/>
    <path d="M 28 105 L 72 105 L 76 118 L 24 118 Z" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="1.5"/>
    <!-- Star on Cup -->
    <polygon points="50,38 53,47 62,47 55,52 58,61 50,56 42,61 45,52 38,47 47,47" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Winner Badge Pill -->
  <g transform="translate(300, 275)">
    <rect width="200" height="32" rx="16" fill="#eab308" fill-opacity="0.15" stroke="#eab308" stroke-width="1.5"/>
    <text x="100" y="21" fill="#fef08a" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">★ 1ST PLACE WINNER ★</text>
  </g>

  <!-- Title & Event Details -->
  <text x="400" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="-0.5">InnerSight • 3D Spatial Wayfinding</text>
  <text x="400" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Smart Health Hackathon 2025</text>

  <!-- Verification Tech Footer -->
  <g transform="translate(180, 420)">
    <rect width="440" height="28" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="220" y="18" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1">HEALTHCARE &amp; 3D SYSTEMS TRACK</text>
  </g>
</svg>
