<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#02050c"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Cyber Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>

  <!-- Outer Boundary Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="28" y="28" width="744" height="444" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Viewfinder Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M 750 20 L 780 20 L 780 50" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M 780 450 L 780 480 L 750 480" stroke="#38bdf8" stroke-width="4" fill="none"/>
  <path d="M 50 480 L 20 480 L 20 450" stroke="#38bdf8" stroke-width="4" fill="none"/>

  <!-- Radial Glow Behind Trophy -->
  <circle cx="400" cy="190" r="130" fill="#0284c7" opacity="0.16" filter="url(#glow)"/>
  <circle cx="400" cy="190" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>

  <!-- Security Shield & Laurel Emblem -->
  <g transform="translate(350, 95) scale(1.1)">
    <!-- Shield Outer -->
    <path d="M 45 10 L 85 25 C 85 68 65 100 45 110 C 25 100 5 68 5 25 Z" fill="url(#shieldGrad)" stroke="#bae6fd" stroke-width="2"/>
    <!-- Shield Inner Core -->
    <path d="M 45 20 L 75 32 C 75 66 59 90 45 98 C 31 90 15 66 15 32 Z" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Checkmark / Lock icon in center -->
    <path d="M 33 58 L 41 66 L 58 48" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Winner Badge Pill -->
  <g transform="translate(255, 275)">
    <rect width="290" height="32" rx="16" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="145" y="21" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">★ TOP OPEN SOURCE CONTRIBUTOR ★</text>
  </g>

  <!-- Title & Event Details -->
  <text x="400" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle" letter-spacing="-0.5">RouteGuard • API Security Middleware</text>
  <text x="400" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="500" text-anchor="middle">Global FOSS Security Challenge 2026</text>

  <!-- Verification Tech Footer -->
  <g transform="translate(180, 420)">
    <rect width="440" height="28" rx="8" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="220" y="18" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="1">AWARD VERIFIED • SECURITY &amp; INFRASTRUCTURE</text>
  </g>
</svg>
